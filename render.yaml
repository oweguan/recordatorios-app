services:
  - type: web
    name: recordatorios-app
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
